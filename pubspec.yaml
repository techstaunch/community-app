name: community_connect
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.9
  hooks_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  pdf: ^3.13.0
  printing: ^5.15.0

  google_fonts: ^8.2.1
  go_router: ^17.5.0
  flutter_hooks: ^0.21.3+1
  google_mlkit_translation: ^0.15.1
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  freezed_annotation: any
  json_annotation: any
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.8
  build_runner: ^2.16.0
  freezed: any
  json_serializable: any
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true


  assets:
    - assets/images/



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/app_logo.png"
  android: true
  ios: true
  android_12:
    image: "assets/images/app_logo.png"
    color: "#FFFFFF"
